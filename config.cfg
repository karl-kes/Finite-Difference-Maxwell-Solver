# FDTD Simulation Configuration
# Lines starting with # are comments.
# Missing keys use hardcoded defaults.

# Grid dimensions
Nx = 40
Ny = 40
Nz = 40

# Spatial step sizes
dx = 1.0
dy = 1.0
dz = 1.0

# Material properties
mu  = 1.0
eps = 1.0

# Time stepping
cfl_factor  = 1.0
total_steps = 1000

# Validation
run_validation = true

# CPML absorbing boundaries
use_pml       = true
pml_order     = 3
pml_kappa_max = 15.0
pml_alpha_max = 0.3
